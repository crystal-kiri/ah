<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記事タイトル | Anaheim Electronics</title>
  <link rel="stylesheet" href="../journal-common.css">
</head>
<body>

<header class="header" id="global-header"></header>

<script>
  // 記事ファイルから見て、一つ上の階層にあるheader.htmlを呼び出す
  fetch('../header.html')
    .then(response => {
      if (!response.ok) throw new Error('Network response was not ok');
      return response.text();
    })
    .then(data => {
      document.getElementById('global-header').innerHTML = data;
    })
    .catch(error => {
      console.error('Header load error:', error);
      // ローカルで見ている時のために最低限のバックアップリンクを表示させても良い
      document.getElementById('global-header').innerHTML = '<div class="header-inner"><a href="/" class="brand">Anaheim Electronics</a></div>';
    });
</script>

<article class="post-container">
  <header class="post-header">
    <span class="post-date">MAY 12, 2026</span>
    <h1 class="post-title">ここに記事タイトルを入れる</h1>
  </header>

  <div class="post-body">
    <p>導入文...</p>
    
    <h2>AIロープレが解決する現場の課題</h2>
    <p>本文...</p>
  </div>

  <section class="post-cta">
    <h3>貴社の営業組織に「Deep AI」の解析力を。</h3>
    <p>導入支援から独自シナリオ構築まで、アナハイムがサポートします。</p>
    <a href="/contact/" class="btn-cta">無料で相談する</a>
  </section>
</article>

</body>
</html>
