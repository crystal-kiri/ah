<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記事タイトル | Anaheim Electronics</title>
  <link rel="stylesheet" href="../journal-common.css">
</head>
<body>

<header class="header" id="global-header"></header>

<script>
  // 記事ファイルから見て、一つ上の階層にあるheader.htmlを呼び出す
  fetch('../header.html')
    .then(response => {
      if (!response.ok) throw new Error('Network response was not ok');
      return response.text();
    })
    .then(data => {
      document.getElementById('global-header').innerHTML = data;
    })
    .catch(error => {
      console.error('Header load error:', error);
      // ローカルで見ている時のために最低限のバックアップリンクを表示させても良い
      document.getElementById('global-header').innerHTML = '<div class="header-inner"><a href="/" class="brand">Anaheim Electronics</a></div>';
    });
</script>

<article class="post-container">
  <header class="post-header">
    <span class="post-date">MAY 12, 2026</span>
    <h1 class="post-title">ここに記事タイトルを入れる</h1>
  </header>

  <div class="post-body">
    <p>導入文...</p>
    
    <h2>AIロープレが解決する現場の課題</h2>
    <p>本文...</p>
  </div>

  <div id="cta-placeholder"></div>

<script>
  // パーツ一括読み込み関数
  function loadComponent(id, path) {
    fetch(path)
      .then(res => res.ok ? res.text() : "")
      .then(data => {
        if(data) document.getElementById(id).innerHTML = data;
      });
  }

  // 実行
  loadComponent('global-header', '../header.html');
  loadComponent('cta-placeholder', '../cta.html');
</script>
</article>

</body>
</html>
