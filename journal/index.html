<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOURNAL | Anaheim Electronics</title>
  
  <link rel="stylesheet" href="/style.css"> 
  
  <style>
    /* ブログ一覧（ジャーナル・トップ）専用のスタイル */
    :root { --max-width: 1100px; }
    
    .journal-hero {
      margin-top: 140px; /* ヘッダー分 */
      padding: 0 24px 60px;
      text-align: center;
      max-width: var(--max-width);
      margin-left: auto;
      margin-right: auto;
    }
    .journal-hero .label {
      font-family: var(--sans-en);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      color: var(--ink-mute);
      text-transform: uppercase;
    }
    .journal-hero h1 {
      font-family: var(--sans-en);
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      font-weight: 800;
      margin-top: 16px;
    }

    .journal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 40px;
      max-width: var(--max-width);
      margin: 0 auto 120px;
      padding: 0 24px;
    }

    .journal-item {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid var(--line);
      padding-bottom: 30px;
      transition: border-color 0.3s;
    }
    .journal-item:hover { border-color: var(--magenta); }
    
    .journal-item .post-meta {
      font-family: var(--sans-en);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--ink-mute);
      margin-bottom: 12px;
      display: flex; gap: 15px;
    }
    
    .journal-item h2 {
      font-size: 1.4rem;
      line-height: 1.4;
      font-weight: 700;
      color: var(--ink);
    }

    /* レスポンシブ調整 */
    @media (max-width: 980px) {
      .journal-hero { margin-top: 100px; padding-bottom: 40px; }
      .journal-hero h1 { font-size: clamp(2.2rem, 6vw, 4rem); }
      .journal-grid { gap: 30px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="brand">Anaheim Electronics</a>
    <nav class="nav">
      <a href="/#services">FEATURES</a>
      <a href="/journal/">JOURNAL</a>
      <a href="/contact/">CONTACT</a>
    </nav>
    <a href="/pippon-time/" class="header-cta">PIPPON TIME →</a>
  </div>
</header>

<main>
  <section class="journal-hero">
    <span class="label">Our Journal</span>
    <h1>INSIGHTS,<br>NOT NOISE.</h1>
  </section>

  <section class="journal-grid">
    <a href="./posts/2026-05-12.html" class="journal-item">
      <div class="post-meta">
        <span class="date">MAY 12, 2026</span>
        <span class="category">DX THEORY</span>
      </div>
      <h2>現場に「静寂」を届ける。DXが忘れてしまったもの。</h2>
    </a>
    
    <a href="./posts/2026-05-13.html" class="journal-item">
      <div class="post-meta">
        <span class="date">MAY 13, 2026</span>
        <span class="category">AI IMPLEMENTATION</span>
      </div>
      <h2>多機能という名のノイズ。代理店としての私たちの回答。</h2>
    </a>

  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="left">© 2026 Anaheim Electronics LLC</div>
  </div>
</footer>

</body>
</html>
