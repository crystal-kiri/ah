<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOURNAL | Anaheim Electronics</title>
  
  <style>
    /* 1. 根本的な溢れ防止とボックスモデルの統一 */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden; /* 万が一のハミ出しをカット */
  background-color: #ffffff;
  color: #10081a;
  -webkit-font-smoothing: antialiased;
}

/* フォント設定 */
@font-face{font-family:"Signale";src:url("/assets/signale.woff") format("woff");font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:"Kokumin";src:url("/assets/kokumin.ttf") format("truetype");font-weight:400 900;font-style:normal;font-display:swap}

:root {
  --bg: #ffffff;
  --ink: #10081a;
  --container: 1280px;
  --display: "Signale", "Anton", sans-serif;
  --sans-en: "Inter", system-ui, sans-serif;
  --sans-jp: "Kokumin", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
}

/* 2. ヘッダー：横幅100%を維持しつつハミ出し防止 */
.header {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 80px;
  background: #000 !important;
  z-index: 30;
}

.header-inner {
  max-width: var(--container);
  width: 100%;
  margin: 0 auto;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0 24px; /* スマホで見切れないよう調整 */
}

.brand {
  font-family: var(--sans-en) !important;
  font-weight: 700 !important;
  font-size: .96rem !important;
  color: #fff !important;
  text-decoration: none;
}

.nav {
  display: flex;
  gap: 24px;
  margin-left: auto;
  font-family: var(--sans-jp);
  font-size: .86rem;
}

.nav a { color: rgba(255,255,255,.85) !important; text-decoration: none; }

.header-cta {
  font-family: var(--sans-en);
  font-size: .82rem;
  font-weight: 700;
  padding: 9px 20px;
  border: 1.5px solid #fff;
  color: #fff !important;
  text-transform: uppercase;
  margin-left: 24px;
  text-decoration: none;
}

/* 3. メイン・ヒーローセクション */
main { padding-top: 80px; width: 100%; }

.journal-hero {
  min-height: 60vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  width: 100%;
}

.journal-hero h1 {
  font-family: var(--display);
  font-size: clamp(3rem, 12vw, 10rem); /* スマホでハミ出さないよう最小値を調整 */
  line-height: 0.9;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-transform: uppercase;
  word-break: break-all;
}

/* 4. 【最重要】記事リストをGridに変更 */
.journal-grid {
  max-width: var(--container);
  width: 100%;
  margin: 0 auto;
  padding: 0 24px 100px;
  display: grid;
  /* 画面幅に合わせて自動でカラム数を変える */
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap: 60px 40px;
}

.journal-item {
  display: block;
  text-decoration: none;
  color: inherit;
  transition: opacity 0.3s;
}

.journal-item:hover { opacity: 0.7; }

.post-meta {
  display: block;
  font-family: var(--sans-en);
  font-size: .75rem;
  color: #7d6c80;
  margin-bottom: 12px;
}

.journal-item h2 {
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.5;
  margin: 0;
}

/* 5. スマホ用レスポンシブ */
@media (max-width: 768px) {
  .header-inner { padding: 0 16px; }
  .nav { display: none; } /* スマホではメニューを隠すかハンバーガーにするのが一般的 */
  
  .journal-hero { min-height: 40vh; }
  .journal-grid {
    grid-template-columns: 1fr; /* 1列に固定 */
    gap: 40px;
  }
}
    
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="brand">Anaheim Electronics</a>
    <nav class="nav">
      <a href="/#services">FEATURES</a>
      <a href="/journal/">JOURNAL</a>
      <a href="/contact/">CONTACT</a>
    </nav>
    <a href="/pippon-time/" class="header-cta">PIPPON TIME →</a>
  </div>
</header>

<main>
  <section class="journal-hero">
    <h1>INSIGHTS,<br>NOT NOISE.</h1>
  </section>

  <section class="journal-grid"></section>
</main>

<script>
  fetch('./list.json')
    .then(response => response.json())
    .then(data => {
      const container = document.querySelector('.journal-grid');
      // dataを逆順（新しい順）にしてから表示
      container.innerHTML = data.reverse().map(post => `
        <a href="${post.url}" class="journal-item">
          <span class="post-meta">${post.date}</span>
          <h2>${post.title}</h2>
        </a>
      `).join('');
    })
    .catch(error => console.error('Error loading journal list:', error));
</script>

</body>
</html>
