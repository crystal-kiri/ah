<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOURNAL | Anaheim Electronics</title>
  
  <style>
    /* --- 1. トップページから拝借した共通スタイル --- */
    :root {
      --bg:#ffffff; --ink:#10081a; --ink-soft:#3d2e44; --ink-mute:#7d6c80;
      --magenta:#e91e63; --container:1280px;
      --display:"Signale","Anton",sans-serif;
      --sans-en:"Inter",system-ui,sans-serif;
      --sans-jp:"Kokumin","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
    }
    body { font-family: var(--sans-jp); background: var(--bg); color: var(--ink); margin: 0; line-height: 1.95; -webkit-font-smoothing: antialiased; }
    
    /* --- Header：ここをトップページと完全に一致させます --- */
    .header {
      position: absolute; /* 他のページと同じ配置 */
      top: 0;
      left: 0;
      width: 100%; /* 横幅いっぱい */
      height: 80px;
      background: #000000; /* 背景を真っ黒に固定 */
      z-index: 999;
      display: flex;
      align-items: center;
    }
    .header-inner {
      width: 100%;
      max-width: var(--container); /* ai-hiringと同じ1180px */
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 0 32px;
    }
    .brand {
      font-family: var(--sans-en);
      font-weight: 700;
      color: #ffffff !important;
      font-size: .96rem;
    }
    .nav {
      margin-left: auto;
      display: flex;
      gap: 26px;
    }
    .nav a {
      color: rgba(255,255,255,0.85) !important;
      font-size: .86rem;
      font-weight: 500;
    }
    .header-cta {
      margin-left: 28px;
      color: #ffffff !important;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: .82rem;
      font-weight: 600;
    }

    /* ジャーナルのコンテンツがヘッダーに被らないようにする */
    main {
      padding-top: 80px; 
    }
    /* --- 2. ジャーナル専用のレイアウト --- */
    .journal-hero { margin-top: 160px; text-align: center; padding: 0 24px 80px; max-width: 1100px; margin-left: auto; margin-right: auto; }
    .journal-hero .label { font-family: var(--sans-en); font-size: 0.8rem; letter-spacing: 0.2em; color: var(--ink-mute); text-transform: uppercase; }
    .journal-hero h1 { font-family: var(--sans-en); font-size: clamp(3rem, 7vw, 6rem); line-height: 1.1; letter-spacing: -0.02em; font-weight: 800; margin: 16px 0 0; }

    .journal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 60px 40px; max-width: 1100px; margin: 0 auto 120px; padding: 0 32px; }
    .journal-item { display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform 0.3s ease; }
    .journal-item:hover { transform: translateY(-5px); }
    .journal-item .post-meta { font-family: var(--sans-en); font-size: 0.75rem; letter-spacing: 0.1em; color: var(--ink-mute); margin-bottom: 16px; display: flex; gap: 15px; }
    .journal-item h2 { font-size: 1.5rem; line-height: 1.45; font-weight: 700; color: var(--ink); margin: 0; border-top: 1px solid #eee; padding-top: 20px; }
    .journal-item:hover h2 { color: var(--magenta); }

    /* フッター */
    .footer { border-top: 1px solid #eee; padding: 40px 32px; margin-top: 100px; }
    .footer-inner { max-width: var(--container); margin: 0 auto; display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--ink-mute); }

    @media (max-width: 768px) {
      .nav { display: none; } /* スマホでは一旦隠す */
      .journal-hero { margin-top: 120px; }
      .journal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="brand">Anaheim Electronics</a>
    <nav class="nav">
      <a href="/#services">FEATURES</a>
      <a href="/journal/">JOURNAL</a>
      <a href="/contact/">CONTACT</a>
    </nav>
    <a href="/pippon-time/" class="header-cta">PIPPON TIME →</a>
  </div>
</header>

<main>
  <section class="journal-hero">
    <span class="label">Our Journal</span>
    <h1>INSIGHTS,<br>NOT NOISE.</h1>
  </section>

  <section class="journal-grid">
    <a href="./posts/2026-05-12.html" class="journal-item">
      <div class="post-meta">
        <span class="date">MAY 12, 2026</span>
        <span class="category">DX THEORY</span>
      </div>
      <h2>現場に「静寂」を届ける。DXが忘れてしまったもの。</h2>
    </a>
    
    <a href="./posts/2026-05-13.html" class="journal-item">
      <div class="post-meta">
        <span class="date">MAY 13, 2026</span>
        <span class="category">AI IMPLEMENTATION</span>
      </div>
      <h2>多機能という名のノイズ。代理店としての私たちの回答。</h2>
    </a>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div>© 2026 Anaheim Electronics LLC</div>
  </div>
</footer>

</body>
</html>
