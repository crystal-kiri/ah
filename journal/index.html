<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOURNAL | Anaheim Electronics</title>
  
  <style>
    /* --- 1. フォント定義（トップページと完全一致） --- */
    @font-face{
      font-family:"Signale";
      src:url("/assets/signale.woff") format("woff");
      font-weight:400 900;font-style:normal;font-display:swap;
    }
    @font-face{
      font-family:"Kokumin";
      src:url("/assets/kokumin.ttf") format("truetype");
      font-weight:400 900;font-style:normal;font-display:swap;
    }

    /* --- 2. 変数定義（トップページから移植） --- */
    :root{
      --bg:#ffffff; --bg-soft:#f6f4f0;
      --ink:#10081a; --ink-soft:#3d2e44; --ink-mute:#7d6c80;
      --magenta:#e91e63; --magenta-deep:#a8124a;
      --container:1280px;
      --display:"Signale","Anton",sans-serif;
      --sans-en:"Inter",system-ui,sans-serif;
      --sans-jp:"Kokumin","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:var(--sans-jp); background:var(--bg); color:var(--ink);
      line-height:1.95; font-feature-settings:"palt"; -webkit-font-smoothing:antialiased;
    }

    /* --- 3. Header（トップページの構造を再現） --- */
    .header{
      position:absolute; top:0; left:0; right:0; z-index:30; height:80px;
      background: #000; /* ジャーナルは白背景なので、ヘッダー自体を黒く塗ります */
    }
    .header-inner{
      max-width:var(--container); margin:0 auto; height:100%;
      display:flex; align-items:center; gap:28px; padding:0 32px;
    }
    .brand{
      font-family:var(--sans-en); font-weight:700;
      font-size:.96rem; letter-spacing:-.01em; color:#fff;
      /* mix-blend-modeは背景が黒なので不要 */
    }
    .nav{
      display:flex; gap:28px; margin-left:auto;
      font-family:var(--sans-jp); font-size:.86rem;
      color:rgba(255,255,255,.85); font-weight:500;
    }
    .nav a:hover{color:#fff}
    
    .header-cta {
      font-family: var(--sans-en); font-size: .82rem; font-weight: 700;
      letter-spacing: .08em; padding: 9px 24px; border-radius: 2px;
      color: #ffffff; border: 1.5px solid #ffffff;
      text-transform: uppercase; transition: all .2s ease;
    }
    .header-cta:hover { background: #ffffff; color: #000000; }

    /* --- 4. Journal 独自レイアウト --- */
    .journal-hero { 
      margin-top: 180px; text-align: center; padding: 0 24px 80px; 
    }
    .journal-hero h1 { 
      font-family: var(--display); /* Signaleを適用 */
      font-size: clamp(3rem, 10vw, 7rem); font-weight: 400; line-height: .95; 
      letter-spacing: .005em; text-transform: uppercase;
    }
    .journal-hero .label {
      font-family: var(--sans-en); font-size: .78rem; font-weight: 600;
      letter-spacing: .22em; text-transform: uppercase; color: var(--ink-mute);
      margin-bottom: 24px; display: block;
    }

    .journal-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); /* 2カラム */
      gap: 40px; max-width: 1100px; margin: 0 auto 100px; padding: 0 32px;
    }
    .journal-item {
      padding-top: 40px; border-top: 1px solid var(--line);
      text-decoration: none; color: inherit; transition: .3s;
    }
    .journal-item:hover { border-top-color: var(--magenta); }
    .post-meta { 
      font-family: var(--sans-en); font-size: .75rem; font-weight: 700;
      letter-spacing: .15em; color: var(--ink-mute); margin-bottom: 12px; display: block;
    }
    .journal-item h2 { font-size: 1.5rem; line-height: 1.4; font-weight: 900; }

    @media (max-width: 768px) {
      .nav { display: none; }
      .journal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="brand">Anaheim Electronics</a>
    <nav class="nav">
      <a href="/#services">FEATURES</a>
      <a href="/journal/">JOURNAL</a>
      <a href="/contact/">CONTACT</a>
    </nav>
    <a href="/pippon-time/" class="header-cta">PIPPON TIME →</a>
  </div>
</header>

<main>
  <section class="journal-hero">
    <span class="label">Our Journal</span>
    <h1>INSIGHTS,<br>NOT NOISE.</h1>
  </section>

  <section class="journal-grid">
    <a href="./posts/2026-05-12.html" class="journal-item">
      <div class="post-meta">
        <span class="date">MAY 12, 2026</span>
        <span class="category">DX THEORY</span>
      </div>
      <h2>現場に「静寂」を届ける。DXが忘れてしまったもの。</h2>
    </a>
    
    <a href="./posts/2026-05-13.html" class="journal-item">
      <div class="post-meta">
        <span class="date">MAY 13, 2026</span>
        <span class="category">AI IMPLEMENTATION</span>
      </div>
      <h2>多機能という名のノイズ。代理店としての私たちの回答。</h2>
    </a>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div>© 2026 Anaheim Electronics LLC</div>
  </div>
</footer>

</body>
</html>
