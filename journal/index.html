<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOURNAL | Anaheim Electronics</title>
  
  <style>
    /* 1. 他のページから一字一句漏らさずコピーしたフォント設定 */
    @font-face{font-family:"Signale";src:url("/assets/signale.woff") format("woff");font-weight:400 900;font-style:normal;font-display:swap}
    @font-face{font-family:"Kokumin";src:url("/assets/kokumin.ttf") format("truetype");font-weight:400 900;font-style:normal;font-display:swap}
    
    :root{
      --bg:#ffffff; --ink:#10081a; --ink-soft:#3d2e44; --ink-mute:#7d6c80;
      --container:1280px;
      --display:"Signale","Anton",sans-serif;
      --sans-en:"Inter",system-ui,sans-serif;
      --sans-jp:"Kokumin","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans-jp);background:var(--bg);color:var(--ink);line-height:1.95;-webkit-font-smoothing:antialiased}
    
    /* 2. ヘッダー：配置は他ページと「全く同じ」、でも色だけ「黒」に指定 */
    .header{
      position:absolute;top:0;left:0;right:0;z-index:30;height:80px;
      background:#000000; /* ←ここだけジャーナル専用。これがないと白背景に消える */
    }
    .header-inner{
      max-width:var(--container);margin:0 auto;height:100%;
      display:flex;align-items:center;gap:28px;padding:0 32px;
    }
    .brand{
      font-family:var(--sans-en);font-weight:700;font-size:.96rem;
      color:#fff !important;text-decoration:none !important; /* 青と下線を絶対出さない */
    }
    .nav{display:flex;gap:28px;margin-left:auto;font-family:var(--sans-jp);font-size:.86rem;color:rgba(255,255,255,.85);font-weight:500}
    .nav a{color:inherit;text-decoration:none !important;transition:color .2s}
    .nav a:hover{color:#fff}
    
    .header-cta {
      font-family:var(--sans-en);font-size:.82rem;font-weight:700;letter-spacing:.08em;
      padding:9px 24px;border:1.5px solid #fff;color:#fff !important;
      text-decoration:none !important;text-transform:uppercase;transition:all .2s;
    }
    .header-cta:hover{background:#fff;color:#000}

    /* 3. ジャーナルのメイン部分 */
    .journal-hero { margin-top:160px; text-align:center; padding:0 32px 80px; }
    .journal-hero h1 { font-family:var(--display); font-size:clamp(3rem, 10vw, 7rem); line-height:.95; text-transform:uppercase; }
    
    .journal-grid {
      display:grid; grid-template-columns:repeat(2, 1fr); gap:60px 40px;
      max-width:1100px; margin:0 auto 120px; padding:0 32px;
    }
    .journal-item { border-top:1px solid rgba(16,8,26,.1); padding-top:40px; text-decoration:none; color:inherit; }
    .post-meta { font-family:var(--sans-en); font-size:.75rem; font-weight:700; color:var(--ink-mute); margin-bottom:12px; display:block; }
    .journal-item h2 { font-size:1.5rem; font-weight:900; line-height:1.4; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="brand">Anaheim Electronics</a>
    <nav class="nav">
      <a href="/#services">FEATURES</a>
      <a href="/journal/">JOURNAL</a>
      <a href="/contact/">CONTACT</a>
    </nav>
    <a href="/pippon-time/" class="header-cta">PIPPON TIME →</a>
  </div>
</header>

<main>
  <section class="journal-hero">
    <h1>INSIGHTS,<br>NOT NOISE.</h1>
  </section>
  <section class="journal-grid">
    <a href="./posts/2026-05-12.html" class="journal-item">
      <span class="post-meta">MAY 12, 2026</span>
      <h2>現場に「静寂」を届ける。DXが忘れてしまったもの。</h2>
    </a>
  </section>
</main>

</body>
</html>
