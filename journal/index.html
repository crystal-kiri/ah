<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOURNAL | Anaheim Electronics</title>
  
  <style>
    /* 1. 他のページと共通のフォント設定 */
    @font-face{font-family:"Signale";src:url("/assets/signale.woff") format("woff");font-weight:400 900;font-style:normal;font-display:swap}
    @font-face{font-family:"Kokumin";src:url("/assets/kokumin.ttf") format("truetype");font-weight:400 900;font-style:normal;font-display:swap}
    
    :root{
      --bg:#ffffff; --ink:#10081a;
      --container:1280px; /* トップページと同じ幅 */
      --display:"Signale","Anton",sans-serif;
      --sans-en:"Inter",system-ui,sans-serif;
      --sans-jp:"Kokumin","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
    }

    /* 2. リンクの「青」と「下線」をページ全体で強制的に殺す */
    a, a:visited, a:hover, a:active {
      text-decoration: none !important;
      color: inherit !important;
    }

    *{box-sizing:border-box; margin:0; padding:0}
    body{font-family:var(--sans-jp); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased}
    
    /* 3. ヘッダー：配置・高さ・フォントを他ページと完全一致させる */
    .header{
      position: absolute; top:0; left:0; right:0; z-index:30; height:80px;
      background: #000 !important; /* ここだけジャーナル専用：白背景でも見えるように */
    }
    .header-inner{
      max-width:var(--container); margin:0 auto; height:100%;
      display:flex; align-items:center; gap:28px; padding:0 32px;
    }

    /* ロゴ：ai-hiring等の設定を完全再現 */
    .brand{
      font-family:var(--sans-en) !important; font-weight:700 !important;
      font-size:.96rem !important; color:#fff !important;
    }

    /* メニュー：ai-hiring等の設定を完全再現 */
    .nav{
      display:flex; gap:28px; margin-left:auto;
      font-family:var(--sans-jp); font-size:.86rem; font-weight:500;
      color:rgba(255,255,255,.85) !important;
    }
    .nav a{ color:rgba(255,255,255,.85) !important; }
    .nav a:hover{ color:#fff !important; }
    
    /* ボタン：ai-hiring等の設定を完全再現 */
    .header-cta {
      font-family:var(--sans-en); font-size:.82rem; font-weight:700;
      padding:9px 24px; border:1.5px solid #fff; color:#fff !important;
      text-transform:uppercase; transition:all .2s;
    }
    .header-cta:hover{ background:#fff; color:#000 !important; }

    /* メインコンテンツの位置調整 */
    main { padding-top: 100px; }
    /* --- ジャーナル：ヒーローセクション（巨大文字） --- */
    .journal-hero {
      min-height: 70vh; /* 画面の高さの7割を占める */
      display: flex;
      align-items: center; /* 垂直中央 */
      justify-content: center; /* 水平中央 */
      text-align: center;
      padding: 60px 20px;
    }

    .journal-hero h1 {
      font-family: var(--display);
      font-size: clamp(4rem, 15vw, 11rem); /* 画面幅に合わせて巨大化 */
      line-height: 0.85;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-transform: uppercase;
    }

    /* --- 記事リスト（横並びレイアウト） --- */
    .journal-grid {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 32px 120px;
      display: flex;
      gap: 60px; /* 記事同士の間隔 */
      justify-content: flex-start; /* 左から並べる（センターならcenter） */
    }

    .journal-item {
      display: block;
      max-width: 400px;
      transition: opacity 0.3s;
    }

    .journal-item:hover {
      opacity: 0.7;
    }

    .post-meta {
      display: block;
      font-family: var(--sans-en);
      font-size: .75rem;
      letter-spacing: .1em;
      color: #7d6c80; /* 少し薄めの文字色 */
      margin-bottom: 12px;
    }

    .journal-item h2 {
      font-family: var(--sans-jp);
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--ink);
    }

    /* スマホ対応：縦に並べる */
    @media (max-width: 900px) {
      .journal-grid {
        flex-direction: column;
        gap: 40px;
      }
      .journal-hero h1 {
        font-size: 4.5rem; /* スマホではハミ出さないサイズに */
      }
    }
    
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="brand">Anaheim Electronics</a>
    <nav class="nav">
      <a href="/#services">FEATURES</a>
      <a href="/journal/">JOURNAL</a>
      <a href="/contact/">CONTACT</a>
    </nav>
    <a href="/pippon-time/" class="header-cta">PIPPON TIME →</a>
  </div>
</header>

<main>
  <section class="journal-hero">
    <h1>INSIGHTS,<br>NOT NOISE.</h1>
  </section>

  <section class="journal-grid"></section>
</main>

<script>
  fetch('./list.json')
    .then(response => response.json())
    .then(data => {
      const container = document.querySelector('.journal-grid');
      // dataを逆順（新しい順）にしてから表示
      container.innerHTML = data.reverse().map(post => `
        <a href="${post.url}" class="journal-item">
          <span class="post-meta">${post.date}</span>
          <h2>${post.title}</h2>
        </a>
      `).join('');
    })
    .catch(error => console.error('Error loading journal list:', error));
</script>

</body>
</html>
