<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOURNAL | Anaheim Electronics</title>
  
  <style>
    /* --- 1. フォント復活（パスと名前を厳密に固定） --- */
    @font-face{
      font-family:"Signale";
      src:url("/assets/signale.woff") format("woff");
      font-weight:400 900; font-style:normal; font-display:swap;
    }
    @font-face{
      font-family:"Kokumin";
      src:url("/assets/kokumin.ttf") format("truetype");
      font-weight:400 900; font-style:normal; font-display:swap;
    }

    :root{
      --bg:#ffffff; --ink:#10081a; --line:rgba(16,8,26,.10);
      --container:1280px;
      --display:"Signale", sans-serif;
      --sans-en:"Inter", system-ui, sans-serif;
      --sans-jp:"Kokumin", sans-serif;
    }

    *{box-sizing:border-box; margin:0; padding:0}
    body{ font-family:var(--sans-jp); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
    a{ text-decoration:none !important; color:inherit; } /* 下線を絶対消す */

    /* --- 2. Header（黒帯・白文字・Signaleフォント） --- */
    .header{
      position:absolute; top:0; left:0; right:0; z-index:100;
      height:80px; background:#000000; /* 背景を真っ黒に固定 */
      display:flex; align-items:center;
    }
    .header-inner{
      width:100%; max-width:var(--container); margin:0 auto;
      display:flex; align-items:center; padding:0 32px;
    }
    .brand{
      font-family:var(--display); /* ここでSignaleを適用 */
      font-weight:400; font-size:1.1rem; color:#ffffff !important;
      letter-spacing:.02em; text-transform:lowercase; /* anaheim electronics */
    }
    .nav{
      margin-left:auto; display:flex; gap:28px;
      font-family:var(--sans-en); font-size:.82rem; font-weight:700;
      color:#ffffff !important; letter-spacing:.05em;
    }
    .nav a{ color:#ffffff !important; transition:opacity .2s; }
    .nav a:hover{ opacity:0.7; }
    
    .header-cta {
      margin-left:28px; font-family:var(--sans-en); font-size:.78rem; font-weight:800;
      padding:10px 22px; border:1.5px solid #ffffff; color:#ffffff !important;
      border-radius:2px; text-transform:uppercase; transition:all .2s;
    }
    .header-cta:hover { background:#ffffff; color:#000000 !important; }

    /* --- 3. Journal Layout --- */
    .journal-hero { margin-top:180px; text-align:center; padding-bottom:100px; }
    .journal-hero h1 { 
      font-family:var(--display); font-size:clamp(3.5rem, 12vw, 8rem); 
      line-height:0.9; text-transform:uppercase; letter-spacing:-0.02em;
    }
    .journal-hero .label { 
      font-family:var(--sans-en); font-size:.75rem; font-weight:700;
      letter-spacing:.3em; color:#7d6c80; margin-bottom:20px; display:block;
    }

    .journal-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:60px 40px;
      max-width:1100px; margin:0 auto 120px; padding:0 32px;
    }
    .journal-item { border-top:1px solid var(--line); padding-top:40px; }
    .post-meta { font-family:var(--sans-en); font-size:.7rem; font-weight:700; color:#7d6c80; margin-bottom:15px; }
    .journal-item h2 { font-size:1.6rem; font-weight:900; line-height:1.4; letter-spacing:-.01em; }

    @media (max-width:800px){
      .nav, .header-cta { display:none; }
      .journal-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="brand">Anaheim Electronics</a>
    <nav class="nav">
      <a href="/#services">FEATURES</a>
      <a href="/journal/">JOURNAL</a>
      <a href="/contact/">CONTACT</a>
    </nav>
    <a href="/pippon-time/" class="header-cta">PIPPON TIME →</a>
  </div>
</header>

<main>
  <section class="journal-hero">
    <span class="label">Our Journal</span>
    <h1>INSIGHTS,<br>NOT NOISE.</h1>
  </section>

  <section class="journal-grid">
    <a href="./posts/2026-05-12.html" class="journal-item">
      <div class="post-meta">
        <span class="date">MAY 12, 2026</span>
        <span class="category">DX THEORY</span>
      </div>
      <h2>現場に「静寂」を届ける。DXが忘れてしまったもの。</h2>
    </a>
    
    <a href="./posts/2026-05-13.html" class="journal-item">
      <div class="post-meta">
        <span class="date">MAY 13, 2026</span>
        <span class="category">AI IMPLEMENTATION</span>
      </div>
      <h2>多機能という名のノイズ。代理店としての私たちの回答。</h2>
    </a>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div>© 2026 Anaheim Electronics LLC</div>
  </div>
</footer>

</body>
</html>
